# ============================================================================
# S/ AgentOS Kernel v0.1.3 — Docker Compose
# ============================================================================
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.84.0
    restart: unless-stopped
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - S_AGENTOS_KERNEL_VERSION=${S_AGENTOS_KERNEL_VERSION}
      - S_AGENTOS_OPERATOR_KEY=${S_AGENTOS_OPERATOR_KEY}
      - S_AGENTOS_API_TOKEN=${S_AGENTOS_API_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentos_network

  s-context-v2:
    build:
      context: ./context-v2
    restart: unless-stopped
    ports:
      - "${S_CONTEXT_BIND_ADDRESS:-127.0.0.1}:${S_CONTEXT_PORT:-8787}:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - S_CONTEXT_DB=/data/context-v2.sqlite
      - S_CONTEXT_OPERATOR_KEY=${S_CONTEXT_OPERATOR_KEY}
      - S_CONTEXT_PRINCIPAL_KEYS=${S_CONTEXT_PRINCIPAL_KEYS:-{}}
    volumes:
      - context_v2_data:/data
    networks:
      - agentos_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentos_network

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  context_v2_data:
    driver: local

networks:
  agentos_network:
    driver: bridge
